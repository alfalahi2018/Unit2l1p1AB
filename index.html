<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 2 · Awesome animals · Lesson 1, part 2</title>
<style>
:root{--o:#e0734f;--bl:#4a5d8a;--bg:#fff6ef;--ink:#2b2b2b;--card:#fff;--ok:#16a34a;--no:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#1e1a19;--ink:#f3ede8;--card:#2b2524}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;line-height:1.5}
.w{max-width:820px;margin:0 auto;padding:14px}
.hd{background:var(--bl);color:#fff;border-radius:16px;padding:14px 16px}.hd small{opacity:.85}.hd h1{margin:2px 0 0;color:#ffd9c9;font-size:1.8rem}
h2{color:var(--o);margin:18px 0 4px}.nm{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.nm label{flex:1;min-width:140px;font-weight:bold}
input[type=text]{width:100%;padding:8px;border:2px solid #e3c8bb;border-radius:10px;font-size:1rem;background:var(--card);color:var(--ink)}
.l{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.it{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid #ecd8cd;border-radius:12px;padding:8px}.it.ok{border-color:var(--ok)}.it.no{border-color:var(--no)}
.n{background:var(--o);color:#fff;border-radius:50%;width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:bold}
.pt{letter-spacing:3px;font-weight:bold;font-size:1.1rem;min-width:100px;font-family:monospace}.it input{min-width:0}
.fb{font-size:.85rem;font-weight:bold}.ok .fb{color:var(--ok)}.no .fb{color:var(--no)}
button{background:var(--o);color:#fff;border:0;border-radius:999px;padding:11px 22px;font-size:1.05rem;font-weight:bold;cursor:pointer;margin:8px 6px 0 0}
#gr{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:480px;margin:8px auto;touch-action:manipulation;user-select:none}
#gr div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid #e3c8bb;border-radius:6px;font-weight:bold;font-size:clamp(.8rem,3.6vw,1.2rem);cursor:pointer}
#gr div.s{background:#ffd54a;color:#222}#gr div.f{background:#7ed6a0;color:#123}
#wl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}#wl span{background:var(--card);border:2px dashed var(--o);border-radius:999px;padding:4px 12px;font-weight:bold}#wl span.d{background:var(--ok);color:#fff;border:2px solid var(--ok);text-decoration:line-through}
#res,#msg{text-align:center;font-weight:bold;font-size:1.15rem;min-height:1.6em}
footer{text-align:center;margin:22px 0 8px}footer span{background:#fcd3c0;color:#2b1a00;padding:6px 16px;border-radius:12px;font-weight:bold}
</style></head><body><div class="w">
<div class="hd"><small>Lesson 1, part 2</small><h1>2 · Awesome animals</h1><b>Vocabulary</b></div>
<div class="nm"><label>Name <input type="text" id="nm"></label><label>Grade <input type="text" id="gr2"></label></div>
<h2>1 Complete the animal body parts. Then find and circle.</h2>
<div class="l" id="l"></div><button id="chk">✅ Check words</button><button id="hint">💡 Show a hint</button><div id="res"></div>
<h2>🔎 Find and circle the 12 words</h2>
<p>Tap the first letter, then tap the last letter of a word. Words go across, down or diagonally ↘.</p>
<div id="wl"></div><div id="gr"></div><div id="msg"></div>
<footer><span>Created by T.Badria Alfalahi</span></footer></div>
<script>
const D={"grid": [["L", "F", "T", "A", "C", "G", "T", "M", "E", "W", "U", "I"], ["L", "T", "L", "H", "O", "R", "N", "P", "L", "H", "P", "D"], ["D", "P", "O", "I", "P", "P", "A", "A", "S", "I", "J", "F"], ["C", "C", "E", "D", "P", "X", "N", "W", "C", "S", "K", "I"], ["B", "L", "X", "I", "P", "P", "T", "S", "A", "K", "W", "N"], ["E", "F", "A", "Q", "A", "G", "E", "Q", "L", "E", "L", "S"], ["A", "E", "W", "W", "R", "A", "N", "R", "E", "R", "Y", "Q"], ["K", "J", "U", "C", "S", "W", "N", "I", "S", "S", "Q", "L"], ["F", "H", "U", "M", "P", "L", "A", "Y", "H", "R", "R", "Y"], ["S", "P", "I", "N", "E", "S", "E", "Q", "K", "U", "H", "T"], ["Z", "Z", "Y", "G", "Z", "H", "M", "X", "Z", "H", "G", "Q"], ["P", "L", "X", "T", "O", "N", "G", "U", "E", "A", "A", "Z"]], "words": [{"w": "antennae", "p": "a _ t e _ _ _ e"}, {"w": "beak", "p": "b _ _ k"}, {"w": "claws", "p": "c _ a _ s"}, {"w": "fins", "p": "f _ _ s"}, {"w": "flippers", "p": "f _ i _ _ e _ s"}, {"w": "paws", "p": "p _ _ s"}, {"w": "horn", "p": "h _ r _"}, {"w": "scales", "p": "s _ a _ _ s"}, {"w": "spines", "p": "s _ i _ _ s"}, {"w": "tongue", "p": "t _ n _ _ e"}, {"w": "hump", "p": "h _ m _"}, {"w": "whiskers", "p": "w _ _ _ k _ _ s"}]},$=s=>document.querySelector(s);
D.words.forEach((o,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<span class="n">${i+1}</span><span class="pt">${o.p}</span><input type="text" autocomplete="off" spellcheck="false" aria-label="word ${i+1}"><span class="fb"></span>`;$('#l').appendChild(d)});
const norm=s=>s.toLowerCase().replace(/[^a-z]/g,'');
$('#chk').onclick=()=>{let sc=0;[...$('#l').children].forEach((d,i)=>{const ok=norm(d.querySelector('input').value)===D.words[i].w;d.className='it '+(ok?'ok':'no');d.querySelector('.fb').textContent=ok?'✅':'❌ '+D.words[i].w;sc+=ok});$('#res').textContent=`Score: ${sc} / 12 ${sc==12?'🏆 Excellent!':sc>=9?'🌟 Very good!':sc>=6?'👍 Good try!':'💪 Try again!'}`};
$('#hint').onclick=()=>{const d=[...$('#l').children].find((d,i)=>norm(d.querySelector('input').value)!==D.words[i].w);if(d){const i=[...$('#l').children].indexOf(d);d.querySelector('input').placeholder='Hint: '+D.words[i].w.length+' letters'}};
const wl=$('#wl'),gr=$('#gr'),N=12;let found=new Set(),st=null;
D.words.forEach(o=>{const s=document.createElement('span');s.id='w_'+o.w;s.textContent=o.w;wl.appendChild(s)});
const cells=[];D.grid.forEach((row,r)=>row.forEach((ch,c)=>{const d=document.createElement('div');d.textContent=ch;d.onclick=()=>pick(r,c);gr.appendChild(d);cells.push(d)}));
const at=(r,c)=>cells[r*N+c];
function pick(r,c){if(!st){st=[r,c];at(r,c).classList.add('s');return}
const [r0,c0]=st;cells.forEach(x=>x.classList.remove('s'));st=null;
const dr=Math.sign(r-r0),dc=Math.sign(c-c0),len=Math.max(Math.abs(r-r0),Math.abs(c-c0))+1;
if(!(r==r0||c==c0||Math.abs(r-r0)==Math.abs(c-c0))||len<2){$('#msg').textContent='Try again – pick the first and last letter in a straight line.';return}
const p=[];let s='';for(let i=0;i<len;i++){p.push([r0+dr*i,c0+dc*i]);s+=D.grid[r0+dr*i][c0+dc*i]}
s=s.toLowerCase();const w=[s,[...s].reverse().join('')].find(x=>D.words.some(o=>o.w===x));
if(w&&!found.has(w)){found.add(w);p.forEach(([a,b])=>at(a,b).classList.add('f'));$('#w_'+w).classList.add('d');$('#msg').textContent=found.size==12?'🏆 You found all 12 words!':`🎉 Found "${w}"! (${found.size}/12)`}
else $('#msg').textContent=w?'You already found that one.':'❌ Not a word on the list. Try again!'}
</script></body></html>
